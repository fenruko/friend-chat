name: build
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 25 }
      - name: Tests (no Minecraft needed)
        run: ./test/run-tests.sh
      - name: Build jar
        run: |
          if ! ./gradlew build > "$RUNNER_TEMP/friendchat-gradle.log" 2>&1; then
            tail -n 120 "$RUNNER_TEMP/friendchat-gradle.log"
            detail=$(grep -E '(^> |^\* What went wrong|^FAILURE:|error:|Could not |cannot find symbol|BUILD FAILED)' "$RUNNER_TEMP/friendchat-gradle.log" | tail -n 12 | tr '\n\r%' '   ' || true)
            echo "::error title=Gradle build failure::$detail"
            exit 1
          fi
          cat "$RUNNER_TEMP/friendchat-gradle.log"
      - uses: actions/upload-artifact@v4
        with:
          name: FriendChat-jar
          path: build/libs/friendchat-*.jar
